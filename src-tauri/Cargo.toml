[package]
name = "yt-dlp-deck"
version = "1.1.5"
description = "Interface desktop para baixar mídia com yt-dlp"
authors = ["YT-DLP Deck"]
edition = "2021"

[lib]
name = "yt_dlp_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-mobile-downloader = { path = "plugins/mobile-downloader" }
tokio = { version = "1", features = ["process", "fs", "io-util"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
